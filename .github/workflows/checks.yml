name: Checks (no deployment)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculation and data validation tests
        run: node --test tests/*.test.mjs
